<title>Profile Builder</title>
<!--
  Profile Builder frontend. Open this file directly from disk (file://).

  It is deliberately one self-contained file: browsers won't load local
  modules from file://, so all code and styles are inline. React and htm come
  from a CDN at pinned versions; there is no build step.

  The profile service's HTML is this app's data model. The contract parser
  below is the only code that knows that markup (see backend/html.js).
-->
<script type="importmap">
{

<style>

<body>
<div id="root"></div>

<script type="module">
import { createElement, useCallback, useEffect, useRef, useState } from 'react';
import { createRoot } from 'react-dom/client';
import htm from 'htm';

const html = htm.bind(createElement);

// --- Config -----------------------------------------------------------------

const BACKEND_URL = 'http://localhost:3000';
const OPENROUTER_URL = 'https://openrouter.ai/api/v1/chat/completions';
const DEFAULT_MODEL = 'anthropic/claude-haiku-5.5';
const STORAGE_KEYS = { apiKey: 'profileBuilder.openRouterKey', model: 'profileBuilder.model' };

/** One JSON line per LLM call (and later, tool call). */
function logEvent(event) {
  console.info(JSON.stringify({ time: new Date().toISOString(), ...event }));
}

// --- Contract parser --------------------------------------------------------
// Turns the profile service's HTML into a validated model. This is the only
// code that knows the markup; anything unexpected throws a ContractError
// rather than rendering partial data.

class ContractError extends Error {}

/**
 * @typedef {{ name: string, label: string, kind: 'list' | 'single', values: string[] }} Field
 * @typedef {{ id: string, field: string, existing: string[], newInformation: string,
 *             proposed: { op: string, value: string } | null }} Conflict
 * @typedef {{ outcome: string, message: string }} Result
 * @typedef {{ fields: Field[], conflicts: Conflict[], result: Result | null }} ProfileModel
 */

/** @param {string} text @returns {ProfileModel} */
function parseProfilePage(text) {
  const main = new DOMParser().parseFromString(text, 'text/html').querySelector('main');
  if (!main) throw new ContractError('response has no <main> element');

  const profile = main.querySelector('section#profile');
  if (!profile) throw new ContractError('response has no #profile section');
  const fields = [...profile.querySelectorAll('dd[data-field]')].map(parseField);
  if (fields.length === 0) throw new ContractError('#profile has no fields');

  const conflictsSection = main.querySelector('section#conflicts');
  if (!conflictsSection) throw new ContractError('response has no #conflicts section');
  const conflicts = [...conflictsSection.querySelectorAll('article[data-conflict]')].map(parseConflict);

  return { fields, conflicts, result: parseResult(main) };
}

/** @param {Element} dd @returns {Field} */
function parseField(dd) {
  const name = dd.getAttribute('data-field');
  const kind = dd.getAttribute('data-kind');
  if (!name) throw new ContractError('field without a name');
  if (kind !== 'list' && kind !== 'single') throw new ContractError(`field ${name} has unknown kind "${kind}"`);

  const dt = dd.previousElementSibling;
  const label = dt?.tagName === 'DT' ? dt.textContent.trim() : name;

  const isEmpty = dd.hasAttribute('data-empty');
  const values = isEmpty ? [] : [...dd.querySelectorAll('data[value]')].map((d) => d.getAttribute('value'));
  if (!isEmpty && values.length === 0) throw new ContractError(`field ${name} is neither empty nor has values`);
  if (kind === 'single' && values.length > 1) throw new ContractError(`single field ${name} has several values`);

  return { name, label, kind, values };
}

/** @param {Element} article @returns {Conflict} */
function parseConflict(article) {
  const id = article.getAttribute('data-conflict');
  const field = article.getAttribute('data-field');
  if (!id || !field) throw new ContractError('conflict without an id or field');

  const newInformation = article.querySelector('[data-role="new-information"]')?.textContent.trim();
  if (!newInformation) throw new ContractError(`conflict ${id} has no new information`);

  const existing = [...article.querySelectorAll('[data-role="existing"]')].map((d) => d.getAttribute('value'));
  const proposedEl = article.querySelector('[data-role="proposed"]');
  const proposed = proposedEl
    ? { op: proposedEl.getAttribute('data-op'), value: proposedEl.getAttribute('data-value') }
    : null;

  return { id, field, existing, newInformation, proposed };
}

/** @param {Element} main @returns {Result | null} */
function parseResult(main) {
  const section = main.querySelector('section#result');
  if (!section) return null;
  return {
    outcome: section.getAttribute('data-outcome') ?? 'unknown',
    message: section.querySelector('p')?.textContent.trim() ?? '',
  };
}

// --- Backend client ---------------------------------------------------------

class BackendUnreachableError extends Error {}

/** @returns {Promise<ProfileModel>} */
async function fetchProfile() {
  let response;
  try {
    response = await fetch(`${BACKEND_URL}/profile`, { cache: 'no-store' });
  } catch {
    throw new BackendUnreachableError(`Can't reach the profile service at ${BACKEND_URL}.`);
  }
  if (!response.ok) throw new ContractError(`GET /profile returned HTTP ${response.status}`);
  return parseProfilePage(await response.text());
}

// --- OpenRouter client ------------------------------------------------------

/**
 * A failed model call, classified so the UI can say what to do about it.
 * @typedef {'invalid-key' | 'no-credits' | 'rate-limited' | 'rejected' | 'unavailable' | 'interrupted'} LlmErrorKind
 */
class LlmError extends Error {
  /** @param {LlmErrorKind} kind @param {string} message @param {{ status?: number, detail?: string }} [info] */
  constructor(kind, message, { status, detail } = {}) {
    super(message);
    this.kind = kind;
    this.status = status;
    this.detail = detail;
  }
}

/**
 * Streams a chat completion from OpenRouter as server-sent events.
 * Yields { type: 'text', text } as tokens arrive, then one
 * { type: 'done', id, usage, finishReason }. Throws LlmError on failure, or
 * the fetch AbortError if `signal` is aborted.
 */
async function* streamChatCompletion({ apiKey, model, messages, signal }) {
  let response;
  try {
    response = await fetch(OPENROUTER_URL, {
      method: 'POST',
      headers: {
        Authorization: `Bearer ${apiKey}`,
        'Content-Type': 'application/json',
        'X-Title': 'Profile Builder',
      },
      body: JSON.stringify({ model, messages, stream: true, usage: { include: true } }),
      signal,
    });
  } catch (error) {
    if (signal.aborted) throw error;
    throw new LlmError('unavailable', "Couldn't reach OpenRouter. Check your connection and try again.");
  }
  if (!response.ok) throw await errorFromResponse(response);

  const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
  let buffer = '';
  let id = null;
  let usage = null;
  let finishReason = null;
  let sawDone = false;
  try {
    while (!sawDone) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += value;
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        // Lines starting with ":" are keep-alive comments; blank lines separate events.
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') {
          sawDone = true;
          break;
        }
        let chunk;
        try {
          chunk = JSON.parse(data);
        } catch {
          continue;
        }
        if (chunk.error) {
          throw new LlmError('interrupted', 'The model stopped with an error partway through its reply.', {
            detail: chunk.error.message,
          });
        }
        id ??= chunk.id ?? null;
        usage = chunk.usage ?? usage;
        const choice = chunk.choices?.[0];
        finishReason = choice?.finish_reason ?? finishReason;
        if (choice?.delta?.content) yield { type: 'text', text: choice.delta.content };
      }
    }
  } catch (error) {
    if (signal.aborted || error instanceof LlmError) throw error;
    throw new LlmError('interrupted', 'The connection dropped partway through the reply.');
  } finally {
    reader.cancel().catch(() => {});
  }
  if (!sawDone && !finishReason) throw new LlmError('interrupted', 'The reply ended unexpectedly.');
  yield { type: 'done', id, usage, finishReason };
}

/** @param {Response} response @returns {Promise<LlmError>} */
async function errorFromResponse(response) {
  const status = response.status;
  let detail = '';
  try {
    detail = (await response.json())?.error?.message ?? '';
  } catch {}
  const info = { status, detail };
  if (status === 401) return new LlmError('invalid-key', 'OpenRouter rejected your API key.', info);
  if (status === 402) return new LlmError('no-credits', 'Your OpenRouter account is out of credits.', info);
  if (status === 429) {
    return new LlmError('rate-limited', 'Rate limited by OpenRouter or the model provider. Wait a moment, then retry.', info);
  }
  // 400 (e.g. an unknown model ID) and 403 (e.g. input flagged by moderation).
  if (status >= 400 && status < 500) return new LlmError('rejected', 'OpenRouter rejected the request.', info);
  return new LlmError('unavailable', 'OpenRouter or the model provider is unavailable right now.', info);
}

// --- State ------------------------------------------------------------------

/**
 * Loads the profile on mount and whenever the window regains focus. A failed
 * refresh keeps the last good model and reports the error alongside it.
 */
function useProfile() {
  const [model, setModel] = useState(/** @type {ProfileModel | null} */ (null));
  const [error, setError] = useState(/** @type {Error | null} */ (null));
  const [loading, setLoading] = useState(true);
  const [loadedAt, setLoadedAt] = useState(/** @type {Date | null} */ (null));

  const refresh = useCallback(async () => {
    setLoading(true);
    try {
      setModel(await fetchProfile());
      setError(null);
      setLoadedAt(new Date());
    } catch (e) {
      setError(e);
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => {
    refresh();
    window.addEventListener('focus', refresh);
    return () => window.removeEventListener('focus', refresh);
  }, [refresh]);

  return { model, error, loading, loadedAt, refresh };
}

/**
 * The OpenRouter key and model, kept in localStorage. The key never leaves
 * this browser except in requests to OpenRouter.
 */
function useSettings() {
  const [settings, setSettings] = useState(() => ({
    apiKey: localStorage.getItem(STORAGE_KEYS.apiKey) ?? '',
    model: localStorage.getItem(STORAGE_KEYS.model) || DEFAULT_MODEL,
  }));

  const save = useCallback(({ apiKey, model }) => {
    const next = { apiKey: apiKey.trim(), model: model.trim() || DEFAULT_MODEL };
    if (next.apiKey) localStorage.setItem(STORAGE_KEYS.apiKey, next.apiKey);
    else localStorage.removeItem(STORAGE_KEYS.apiKey);
    if (next.model === DEFAULT_MODEL) localStorage.removeItem(STORAGE_KEYS.model);
    else localStorage.setItem(STORAGE_KEYS.model, next.model);
    setSettings(next);
  }, []);

  return [settings, save];
}

/**
 * @typedef {{ id: string, role: 'user', content: string }} UserMessage
 * @typedef {{ id: string, role: 'assistant', content: string,
 *             status: 'streaming' | 'done' | 'stopped' | 'error', error?: LlmError }} AssistantMessage
 * @typedef {UserMessage | AssistantMessage} ChatMessage
 */

/** The conversation, and sending, stopping and retrying replies. */
function useChat({ apiKey, model }) {
  const [messages, setMessages] = useState(/** @type {ChatMessage[]} */ ([]));
  const [busy, setBusy] = useState(false);
  const controllerRef = useRef(/** @type {AbortController | null} */ (null));

  const updateMessage = (id, change) => setMessages((ms) => ms.map((m) => (m.id === id ? { ...m, ...change(m) } : m)));

  /** Streams an assistant reply to `history`, which ends with a user message. */
  const respond = async (history) => {
    const reply = { id: crypto.randomUUID(), role: 'assistant', content: '', status: 'streaming' };
    setMessages([...history, reply]);
    setBusy(true);
    const controller = new AbortController();
    controllerRef.current = controller;
    const started = performance.now();
    const log = (outcome, extra = {}) =>
      logEvent({ event: 'llm.call', model, outcome, latencyMs: Math.round(performance.now() - started), ...extra });

    try {
      const stream = streamChatCompletion({ apiKey, model, messages: toApiMessages(history), signal: controller.signal });
      for await (const event of stream) {
        if (event.type === 'text') updateMessage(reply.id, (m) => ({ content: m.content + event.text }));
        if (event.type === 'done') {
          updateMessage(reply.id, () => ({ status: 'done' }));
          log('ok', { requestId: event.id, finishReason: event.finishReason, usage: event.usage });
        }
      }
    } catch (error) {
      if (controller.signal.aborted) {
        updateMessage(reply.id, () => ({ status: 'stopped' }));
        log('stopped');
      } else {
        const llmError = error instanceof LlmError ? error : new LlmError('unavailable', 'Something went wrong.');
        updateMessage(reply.id, () => ({ status: 'error', error: llmError }));
        log('error', { kind: llmError.kind, status: llmError.status, detail: llmError.detail ?? String(error) });
      }
    } finally {
      controllerRef.current = null;
      setBusy(false);
    }
  };

  const send = (text) => {
    if (busy) return;
    respond([...messages, { id: crypto.randomUUID(), role: 'user', content: text }]);
  };

  /** Re-requests the last reply if it failed. */
  const retry = () => {
    const last = messages.at(-1);
    if (busy || last?.role !== 'assistant' || last.status !== 'error') return;
    respond(messages.slice(0, -1));
  };

  const stop = () => controllerRef.current?.abort();

  return { messages, busy, send, retry, stop };
}

/**
 * What the model sees: user messages and replies the user actually received.
 * Failed replies are left out, so a retry starts clean.
 * @param {ChatMessage[]} messages
 */
function toApiMessages(messages) {
  return messages
    .filter((m) => m.role === 'user' || ((m.status === 'done' || m.status === 'stopped') && m.content))
    .map(({ role, content }) => ({ role, content }));
}

// --- Components -------------------------------------------------------------

function App() {
  const profile = useProfile();
  const [settings, saveSettings] = useSettings();
  const chat = useChat(settings);
  const [settingsOpen, setSettingsOpen] = useState(false);

  return html`
    <div className="app">
      <${Header} onOpenSettings=${() => setSettingsOpen(true)} />
      <div className="workspace">
        ${settings.apiKey
          ? html`<${Chat} ...${chat} onOpenSettings=${() => setSettingsOpen(true)} />`
          : html`<${SetupCard} settings=${settings} onSave=${saveSettings} />`}
        <${ProfilePanel} ...${profile} />
      </div>
      ${settingsOpen &&
      html`<${SettingsDialog}
        settings=${settings}
        onSave=${(next) => {
          saveSettings(next);
          setSettingsOpen(false);
        }}
        onClose=${() => setSettingsOpen(false)}
      />`}
    </div>
  `;
}

function Header({ onOpenSettings }) {
  return html`
    <header className="header">
      <div className="brand-mark" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="9" />
          <path d="m15.5 8.5-2 5-5 2 2-5z" />
        </svg>
      </div>
      <div>
        <div className="brand-name">Profile Builder</div>
        <div className="brand-tagline">Your travel preferences, built through conversation</div>
      </div>
      <button className="icon-button" onClick=${onOpenSettings} aria-label="Settings" title="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" />
        </svg>
      </button>
    </header>
  `;
}

// --- Chat components --------------------------------------------------------

function Chat({ messages, busy, send, retry, stop, onOpenSettings }) {
  const endRef = useRef(null);
  useEffect(() => {
    endRef.current?.scrollIntoView({ block: 'end' });
  }, [messages]);

  return html`
    <section className="card chat" aria-label="Chat">
      <div className="messages" aria-live="polite">
        ${messages.length === 0 &&
        html`<div className="chat-empty">
          <h2>Tell me how you like to travel</h2>
          <p>Where you've loved going, who you travel with, what you like to eat. Your profile fills in on the right.</p>
        </div>`}
        ${messages.map(
          (m, i) => html`<${Message}
            key=${m.id}
            message=${m}
            isLast=${i === messages.length - 1}
            onRetry=${retry}
            onOpenSettings=${onOpenSettings}
          />`,
        )}
        <div ref=${endRef} />
      </div>
      <${Composer} busy=${busy} onSend=${send} onStop=${stop} />
    </section>
  `;
}

function Message({ message, isLast, onRetry, onOpenSettings }) {
  if (message.role === 'user') {
    return html`<div className="message user"><div className="bubble">${message.content}</div></div>`;
  }
  const { content, status, error } = message;
  const streaming = status === 'streaming';
  return html`
    <div className="message assistant">
      ${(content || streaming) &&
      html`<div className=${`bubble${streaming && content ? ' caret' : ''}`}>
        ${content || html`<span className="typing" aria-label="Assistant is typing"><span /><span /><span /></span>`}
      </div>`}
      ${status === 'stopped' && html`<div className="message-note">Stopped</div>`}
      ${status === 'error' &&
      html`<${MessageError} error=${error} partial=${Boolean(content)} canRetry=${isLast} onRetry=${onRetry} onOpenSettings=${onOpenSettings} />`}
    </div>
  `;
}

function MessageError({ error, partial, canRetry, onRetry, onOpenSettings }) {
  const needsSettings = error.kind === 'invalid-key' || error.kind === 'rejected' || error.kind === 'no-credits';
  return html`
    <div className="message-error" role="alert">
      <strong>${error.message}</strong>
      ${error.detail && html`<div className="detail">${error.detail}</div>`}
      ${partial && html`<div className="detail">The text above is incomplete.</div>`}
      <div className="actions">
        ${canRetry && html`<button className="button" onClick=${onRetry}>Retry</button>`}
        ${needsSettings && html`<button className="button" onClick=${onOpenSettings}>Open settings</button>`}
      </div>
    </div>
  `;
}

function Composer({ busy, onSend, onStop }) {
  const [text, setText] = useState('');
  const textareaRef = useRef(null);

  // Grow with the content, up to the max-height set in CSS.
  useEffect(() => {
    const el = textareaRef.current;
    el.style.height = 'auto';
    el.style.height = `${el.scrollHeight + 2}px`;
  }, [text]);

  const submit = () => {
    const message = text.trim();
    if (!message || busy) return;
    onSend(message);
    setText('');
  };

  return html`
    <form
      className="composer"
      onSubmit=${(e) => {
        e.preventDefault();
        submit();
      }}
    >
      <textarea
        ref=${textareaRef}
        rows="1"
        value=${text}
        placeholder=${busy ? 'Waiting for the reply…' : 'Message the assistant'}
        aria-label="Message"
        onInput=${(e) => setText(e.target.value)}
        onKeyDown=${(e) => {
          if (e.key === 'Enter' && !e.shiftKey && !e.nativeEvent.isComposing) {
            e.preventDefault();
            submit();
          }
        }}
      />
      ${busy
        ? html`<button type="button" className="button" onClick=${onStop}>Stop</button>`
        : html`<button type="submit" className="button primary" disabled=${!text.trim()}>Send</button>`}
    </form>
  `;
}

// --- Settings components ----------------------------------------------------

function SetupCard({ settings, onSave }) {
  return html`
    <section className="card chat" aria-label="Set up">
      <div className="setup">
        <h2>Connect a model</h2>
        <p>Profile Builder talks to the model through OpenRouter, using your own API key.</p>
        <${SettingsForm} settings=${settings} onSave=${onSave} submitLabel="Start chatting" />
      </div>
    </section>
  `;
}

function SettingsDialog({ settings, onSave, onClose }) {
  useEffect(() => {
    const onKey = (e) => e.key === 'Escape' && onClose();
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);

  return html`
    <div className="overlay" onMouseDown=${(e) => e.target === e.currentTarget && onClose()}>
      <div className="card dialog" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <h2 id="settings-title">Settings</h2>
        <${SettingsForm} settings=${settings} onSave=${onSave} onCancel=${onClose} submitLabel="Save" allowRemove />
      </div>
    </div>
  `;
}

function SettingsForm({ settings, onSave, onCancel, submitLabel, allowRemove = false }) {
  const [apiKey, setApiKey] = useState(settings.apiKey);
  const [model, setModel] = useState(settings.model);

  return html`
    <form
      className="settings-form"
      onSubmit=${(e) => {
        e.preventDefault();
        onSave({ apiKey, model });
      }}
    >
      <label>
        OpenRouter API key
        <input
          className="input"
          type="password"
          autoComplete="off"
          spellCheck="false"
          placeholder="sk-or-…"
          value=${apiKey}
          onInput=${(e) => setApiKey(e.target.value)}
          autoFocus
        />
        <span className="hint">
          Get one at <a href="https://openrouter.ai/keys" target="_blank" rel="noreferrer">openrouter.ai/keys</a>.
          It's stored only in this browser and sent only to OpenRouter.
        </span>
      </label>
      <label>
        Model
        <input
          className="input"
          spellCheck="false"
          placeholder=${DEFAULT_MODEL}
          value=${model}
          onInput=${(e) => setModel(e.target.value)}
        />
        <span className="hint">Any OpenRouter model ID. Default: ${DEFAULT_MODEL}.</span>
      </label>
      <div className="actions">
        ${allowRemove &&
        settings.apiKey &&
        html`<button type="button" className="button quiet" onClick=${() => onSave({ apiKey: '', model })}>
          Remove key
        </button>`}
        <span className="spacer" />
        ${onCancel && html`<button type="button" className="button" onClick=${onCancel}>Cancel</button>`}
        <button type="submit" className="button primary" disabled=${!apiKey.trim()}>${submitLabel}</button>
      </div>
    </form>
  `;
}

// --- Profile panel components -----------------------------------------------

function ProfilePanel({ model, error, loading, loadedAt, refresh }) {
  return html`
    <aside className="card panel" aria-label="Travel profile">
      <div className="panel-header">
        <div>
          <h2 className="panel-title">Travel profile</h2>
          <p className="panel-subtitle">${loadedAt ? `Updated ${formatTime(loadedAt)}` : error ? 'Not loaded' : 'Loading…'}</p>
        </div>
        <button
          className=${`icon-button${loading ? ' spinning' : ''}`}
          onClick=${refresh}
          disabled=${loading}
          aria-label="Refresh profile"
          title="Refresh"
        >
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M21 12a9 9 0 1 1-3-6.7L21 8" />
            <path d="M21 3v5h-5" />
          </svg>
        </button>
      </div>

      ${error && html`<${ErrorNotice} error=${error} hasModel=${Boolean(model)} onRetry=${refresh} />`}
      ${!model && !error && html`<${Skeleton} />`}
      ${model && html`<${ProfileContents} model=${model} />`}
    </aside>
  `;
}

function ProfileContents({ model }) {
  const filled = model.fields.filter((f) => f.values.length > 0).length;
  const conflictedFields = new Set(model.conflicts.map((c) => c.field));
  const labelOf = (name) => model.fields.find((f) => f.name === name)?.label ?? name;

  return html`
    <div className="progress">
      <div className="progress-track">
        <div className="progress-fill" style=${{ width: `${(filled / model.fields.length) * 100}%` }} />
      </div>
      <div className="progress-label">${filled} of ${model.fields.length} preferences shared</div>
    </div>

    ${model.conflicts.length > 0 && html`<${ConflictList} conflicts=${model.conflicts} labelOf=${labelOf} />`}

    <ul className="fields">
      ${model.fields.map(
        (field) => html`<${FieldRow} key=${field.name} field=${field} conflicted=${conflictedFields.has(field.name)} />`,
      )}
    </ul>
  `;
}

function FieldRow({ field, conflicted }) {
  return html`
    <li className="field">
      <div className="field-label">
        ${field.label}
        ${conflicted && html`<span className="field-flag">Needs clarification</span>`}
      </div>
      ${field.values.length === 0
        ? html`<div className="field-empty">Not shared yet</div>`
        : html`<ul className="chips">${field.values.map((v) => html`<li key=${v} className="chip">${v}</li>`)}</ul>`}
    </li>
  `;
}

function ConflictList({ conflicts, labelOf }) {
  return html`
    <section className="conflicts" aria-label="Open conflicts">
      <h3 className="conflicts-title">
        ${conflicts.length === 1 ? 'One thing needs clarifying' : `${conflicts.length} things need clarifying`}
      </h3>
      <p className="conflicts-hint">Nothing has been overwritten. Clarify in the chat to resolve.</p>
      ${conflicts.map(
        (c) => html`
          <div key=${c.id} className="conflict">
            <div className="conflict-field">${labelOf(c.field)}</div>
            <dl className="conflict-compare">
              <dt>Profile says</dt>
              <dd>${c.existing.length ? c.existing.join(', ') : 'nothing yet'}</dd>
              <dt>New</dt>
              <dd>${c.newInformation}</dd>
            </dl>
          </div>
        `,
      )}
    </section>
  `;
}

function ErrorNotice({ error, hasModel, onRetry }) {
  const title =
    error instanceof BackendUnreachableError
      ? error.message
      : error instanceof ContractError
        ? 'The profile service sent something unexpected.'
        : 'Something went wrong loading the profile.';
  return html`
    <div className="notice" role="alert">
      <strong>${title}</strong>
      ${error instanceof BackendUnreachableError
        ? html`Start it with <code>npm start</code> in the project folder.`
        : error.message}
      ${hasModel && html`<div>Showing the last profile that loaded.</div>`}
      <div><button onClick=${onRetry}>Try again</button></div>
    </div>
  `;
}

function Skeleton() {
  return html`
    <div className="skeleton" aria-hidden="true">
      ${[0, 1, 2, 3, 4, 5].map((i) => html`<div key=${i} className="skeleton-row" />`)}
    </div>
  `;
}

/** @param {Date} date */
function formatTime(date) {
  return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
