<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile Builder</title>
<!--
  Profile Builder frontend. Open this file directly from disk (file://).

  It is deliberately one self-contained file: browsers won't load local
  modules from file://, so all code and styles are inline. React and htm come
  from a CDN at pinned versions; there is no build step.

  The profile service's HTML is this app's data model. The contract parser
  below is the only code that knows that markup (see backend/html.js).
-->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.1.0",
    "react-dom/client": "https://esm.sh/react-dom@19.1.0/client",
    "htm": "https://esm.sh/htm@3.1.1"
  }
}
</script>
<style>
  :root {
    --bg: #f6f5f2;
    --surface: #ffffff;
    --surface-muted: #f1efeb;
    --border: #e6e2db;
    --text: #1d1c1a;
    --text-muted: #6f6a62;
    --text-faint: #a29c92;
    --accent: #2f6f62;
    --accent-strong: #245a4f;
    --accent-soft: #e3efeb;
    --on-accent: #ffffff;
    --warn: #a4640f;
    --warn-soft: #fbf1e1;
    --warn-border: #efd6ad;
    --danger: #a63d32;
    --danger-soft: #fbeae7;
    --radius-lg: 18px;
    --radius-md: 12px;
    --shadow: 0 1px 2px rgb(29 28 26 / 0.04), 0 8px 24px rgb(29 28 26 / 0.06);
    --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", system-ui, sans-serif;
    --header-height: 79px;
    color-scheme: light dark;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413;
      --surface: #1c1c1a;
      --surface-muted: #252523;
      --border: #2f2e2b;
      --text: #f0eee9;
      --text-muted: #a8a399;
      --text-faint: #6f6a62;
      --accent: #7cc4b2;
      --accent-strong: #9ad3c4;
      --accent-soft: #1f322d;
      --on-accent: #10201c;
      --warn: #e7b465;
      --warn-soft: #2c2417;
      --warn-border: #4a3a20;
      --danger: #ef8d80;
      --danger-soft: #331d1a;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 8px 24px rgb(0 0 0 / 0.25);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  button, input, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }

  .app {
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
  }

  /* --- Header ----------------------------------------------------------- */

  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    height: var(--header-height);
    padding: 0 32px;
    border-bottom: 1px solid var(--border);
  }

  .header .icon-button { margin-left: auto; }

  .brand-mark {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #d9a441));
    display: grid;
    place-items: center;
    color: white;
  }

  .brand-name { font-weight: 650; letter-spacing: -0.01em; }
  .brand-tagline { color: var(--text-muted); font-size: 13px; }

  /* --- Layout ----------------------------------------------------------- */

  .workspace {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 400px;
    gap: 24px;
    padding: 24px 32px 32px;
    align-items: start;
  }

  @media (max-width: 900px) {
    .workspace { grid-template-columns: 1fr; padding: 16px; }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
  }

  /* --- Buttons and inputs ----------------------------------------------- */

  .icon-button {
    flex: none;
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    transition: background 120ms, color 120ms;
  }
  .icon-button:hover { background: var(--surface-muted); color: var(--text); }
  .icon-button:disabled { cursor: default; opacity: 0.6; }
  .icon-button.spinning svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    font-size: 14px;
    font-weight: 550;
    cursor: pointer;
    transition: background 120ms, border-color 120ms;
  }
  .button:hover { background: var(--surface-muted); }
  .button:disabled { cursor: default; opacity: 0.5; }
  .button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .button.primary:hover:not(:disabled) { background: var(--accent-strong); border-color: var(--accent-strong); }
  .button.quiet { border-color: transparent; background: transparent; color: var(--text-muted); }
  .button.quiet:hover { color: var(--text); background: var(--surface-muted); }

  .input {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    outline: none;
    transition: border-color 120ms, box-shadow 120ms;
  }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  /* --- Chat ------------------------------------------------------------- */

  .chat {
    height: calc(100vh - var(--header-height) - 56px);
    min-height: 420px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 28px 32px 12px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .chat-empty {
    margin: auto;
    max-width: 40ch;
    text-align: center;
  }
  .chat-empty h2 { margin: 0 0 6px; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .chat-empty p { margin: 0; color: var(--text-muted); }

  .message { display: flex; flex-direction: column; gap: 6px; max-width: 72ch; }
  .message.user { align-self: flex-end; align-items: flex-end; }
  .message.assistant { align-self: flex-start; }

  .bubble {
    padding: 10px 15px;
    border-radius: 16px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .message.user .bubble {
    background: var(--accent);
    color: var(--on-accent);
    border-bottom-right-radius: 5px;
  }
  .message.assistant .bubble {
    background: var(--surface-muted);
    border-bottom-left-radius: 5px;
  }

  .caret::after {
    content: "";
    display: inline-block;
    width: 7px;
    height: 1em;
    margin-left: 2px;
    vertical-align: -2px;
    border-radius: 2px;
    background: var(--text-muted);
    animation: blink 1s steps(2) infinite;

  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-faint);
    animation: bounce 1.2s ease-in-out infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: none; opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }

  .message-note { font-size: 12px; color: var(--text-faint); }
  .tool-call {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 2px 8px;
    max-width: 100%;
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text-muted);
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .tool-name { color: var(--text); font-weight: 600; }
  .tool-fields { overflow-wrap: anywhere; color: var(--text-faint); }
  .tool-result {
    margin-left: auto;
    padding: 0 8px;
    border-radius: 99px;
    background: var(--surface-muted);
    white-space: nowrap;
  }
  .tool-call.ok .tool-result { background: var(--accent-soft); color: var(--accent); }
  .tool-call.warn .tool-result { background: var(--warn-soft); color: var(--warn); }
  .tool-call.error .tool-result { background: var(--danger-soft); color: var(--danger); }
  .tool-call.running .tool-result { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.45; } }


  .message-error {
    padding: 10px 14px;
    border-radius: var(--radius-md);
    background: var(--danger-soft);
    color: var(--danger);
    font-size: 13px;

  .message-error .detail { color: var(--text-muted); margin-top: 2px; }
  .message-error .actions { display: flex; gap: 8px; margin-top: 8px; }

  /* --- Settings --------------------------------------------------------- */

  .setup {
    margin: auto;

    padding: 32px;

  .setup h2 { margin: 0 0 6px; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }

  .dialog h2 { margin: 0 0 16px; font-size: 17px; font-weight: 650; }

  /* --- Profile panel ---------------------------------------------------- */

  .panel {
    position: sticky;
    top: 24px;

    border-bottom: 1px solid var(--border);

  .field:last-child { border-bottom: none; }

  .field-label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-muted);

  .field-flag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 1px 8px;
    border-radius: 99px;
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 11px;
    letter-spacing: 0;
    text-transform: none;

    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }

  .chip {
    padding: 3px 11px;
    border-radius: 99px;
    background: var(--accent-soft);
    color: var(--text);
    font-size: 14px;

  .field-empty { color: var(--text-faint); font-size: 14px; }

  /* --- Conflicts -------------------------------------------------------- */

  .conflicts {
    margin: 0 16px 16px;
    padding: 14px 16px;
    border: 1px solid var(--warn-border);
    border-radius: var(--radius-md);

    margin: 0 0 2px;
    font-size: 14px;
    font-weight: 650;

  .conflict-field { font-size: 13px; font-weight: 600; }

  .conflict-compare {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 2px 10px;
    margin: 4px 0 0;
    font-size: 13px;
  }
  .conflict-compare dt { color: var(--text-muted); }
  .conflict-compare dd { margin: 0; }

  /* --- Panel states ----------------------------------------------------- */

  .notice {
    margin: 0 16px 16px;
    padding: 12px 14px;
    border-radius: var(--radius-md);
    background: var(--danger-soft);
    color: var(--danger);
    font-size: 13px;
  }
  .notice strong { display: block; margin-bottom: 2px; }
  .notice code {
    padding: 1px 5px;
    border-radius: 5px;
    background: color-mix(in srgb, var(--danger) 12%, transparent);
    font-size: 12px;
  }
  .notice button {
    margin-top: 8px;
    padding: 5px 12px;
    border: 1px solid currentColor;
    border-radius: 8px;
    background: transparent;
    color: inherit;
    cursor: pointer;
  }

  .skeleton { padding: 4px 24px 24px; }
  .skeleton-row {
    height: 14px;
    margin: 18px 0;
    border-radius: 6px;
    background: linear-gradient(90deg, var(--surface-muted), var(--border), var(--surface-muted));
    background-size: 200% 100%;
    animation: shimmer 1.4s ease-in-out infinite;
  }
  .skeleton-row:nth-child(odd) { width: 70%; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
</style>

<body>
<div id="root"></div>

<script type="module">
import { createElement, useCallback, useEffect, useRef, useState } from 'react';
import { createRoot } from 'react-dom/client';
import htm from 'htm';

const html = htm.bind(createElement);

// --- Config -----------------------------------------------------------------

const BACKEND_URL = 'http://localhost:3000';
const OPENROUTER_URL = 'https://openrouter.ai/api/v1/chat/completions';
const DEFAULT_MODEL = 'anthropic/claude-haiku-5.5';
const STORAGE_KEYS = { apiKey: 'profileBuilder.openRouterKey', model: 'profileBuilder.model' };
const MAX_TOOL_ROUNDS = 8;
/** Marks requests made by the agent's tools, so the backend can apply agent policy. */
const AGENT_HEADER = { name: 'X-Client', value: 'agent' };

/** One JSON line per LLM call and tool call. */
function logEvent(event) {
  console.info(JSON.stringify({ time: new Date().toISOString(), ...event }));
}

// --- Contract parser --------------------------------------------------------
// Turns the profile service's HTML into a validated model. This is the only
// code that knows the markup; anything unexpected throws a ContractError
// rather than rendering partial data.

class ContractError extends Error {}

/**
 * @typedef {{ name: string, label: string, kind: 'list' | 'single', values: string[] }} Field
 * @typedef {{ id: string, field: string, existing: string[], newInformation: string,
 *             proposed: { op: string, value: string } | null }} Conflict
 * @typedef {{ outcome: string, message: string }} Result
 * @typedef {{ fields: Field[], conflicts: Conflict[], result: Result | null }} ProfileModel
 */

/** @param {string} text @returns {ProfileModel} */
function parseProfilePage(text) {
  const main = new DOMParser().parseFromString(text, 'text/html').querySelector('main');
  if (!main) throw new ContractError('response has no <main> element');

  const profile = main.querySelector('section#profile');
  if (!profile) throw new ContractError('response has no #profile section');
  const fields = [...profile.querySelectorAll('dd[data-field]')].map(parseField);
  if (fields.length === 0) throw new ContractError('#profile has no fields');

  const conflictsSection = main.querySelector('section#conflicts');
  if (!conflictsSection) throw new ContractError('response has no #conflicts section');
  const conflicts = [...conflictsSection.querySelectorAll('article[data-conflict]')].map(parseConflict);

  return { fields, conflicts, result: parseResult(main) };
}

/** @param {Element} dd @returns {Field} */
function parseField(dd) {
  const name = dd.getAttribute('data-field');
  const kind = dd.getAttribute('data-kind');
  if (!name) throw new ContractError('field without a name');
  if (kind !== 'list' && kind !== 'single') throw new ContractError(`field ${name} has unknown kind "${kind}"`);

  const dt = dd.previousElementSibling;
  const label = dt?.tagName === 'DT' ? dt.textContent.trim() : name;

  const isEmpty = dd.hasAttribute('data-empty');
  const values = isEmpty ? [] : [...dd.querySelectorAll('data[value]')].map((d) => d.getAttribute('value'));
  if (!isEmpty && values.length === 0) throw new ContractError(`field ${name} is neither empty nor has values`);
  if (kind === 'single' && values.length > 1) throw new ContractError(`single field ${name} has several values`);

  return { name, label, kind, values };
}

/** @param {Element} article @returns {Conflict} */
function parseConflict(article) {
  const id = article.getAttribute('data-conflict');
  const field = article.getAttribute('data-field');
  if (!id || !field) throw new ContractError('conflict without an id or field');

  const newInformation = article.querySelector('[data-role="new-information"]')?.textContent.trim();
  if (!newInformation) throw new ContractError(`conflict ${id} has no new information`);

  const existing = [...article.querySelectorAll('[data-role="existing"]')].map((d) => d.getAttribute('value'));
  const proposedEl = article.querySelector('[data-role="proposed"]');
  const proposed = proposedEl
    ? { op: proposedEl.getAttribute('data-op'), value: proposedEl.getAttribute('data-value') }
    : null;

  return { id, field, existing, newInformation, proposed };
}

/** @param {Element} main @returns {Result | null} */
function parseResult(main) {
  const section = main.querySelector('section#result');
  if (!section) return null;
  return {
    outcome: section.getAttribute('data-outcome') ?? 'unknown',
    message: section.querySelector('p')?.textContent.trim() ?? '',
  };
}

// --- Backend client ---------------------------------------------------------

class BackendUnreachableError extends Error {}

/** @returns {Promise<ProfileModel>} */
async function fetchProfile() {
  let response;
  try {
    response = await fetch(`${BACKEND_URL}/profile`, { cache: 'no-store' });
  } catch {
    throw new BackendUnreachableError(`Can't reach the profile service at ${BACKEND_URL}.`);
  }
  if (!response.ok) throw new ContractError(`GET /profile returned HTTP ${response.status}`);
  return parseProfilePage(await response.text());
}

/**
 * A request made on the agent's behalf, marked with X-Client: agent so the
 * backend can apply agent policy. Returns the page's <main> HTML (what the
 * model sees), its #result outcome, and the parsed profile if the page has
 * one (what the panel sees).
 * @param {{ method: 'GET' | 'POST', path: string, fields?: Record<string, string | string[]>, signal?: AbortSignal }} request
 * @returns {Promise<{ status: number, main: string, outcome: string | null, profile: ProfileModel | null }>}
 */
async function agentRequest({ method, path, fields, signal }) {
  const init = { method, headers: { [AGENT_HEADER.name]: AGENT_HEADER.value }, cache: 'no-store', signal };
  if (method === 'POST') init.body = toFormBody(fields ?? {});
  let response;
  try {
    response = await fetch(backendUrl(path), init);
  } catch (error) {
    if (signal?.aborted || error instanceof ToolInputError) throw error;
    throw new BackendUnreachableError(`Can't reach the profile service at ${BACKEND_URL}.`);
  }
  const text = await response.text();
  const main = new DOMParser().parseFromString(text, 'text/html').querySelector('main');
  let profile = null;
  if (main?.querySelector('section#profile')) {
    try {
      profile = parseProfilePage(text);
    } catch (error) {
      logEvent({ event: 'contract.error', path, error: String(error) });
    }
  }
  return {
    status: response.status,
    main: main ? main.innerHTML.trim() : text.trim(),
    outcome: main?.querySelector('section#result')?.getAttribute('data-outcome') ?? null,
    profile,
  };
}

/** Resolves a model-supplied path against the backend; anything else is refused. */
function backendUrl(path) {
  if (typeof path !== 'string' || !path.startsWith('/') || path.startsWith('//')) {
    throw new ToolInputError(`path must be a path on the profile service starting with "/", got ${JSON.stringify(path)}.`);
  }
  const url = new URL(path, BACKEND_URL);
  if (url.origin !== new URL(BACKEND_URL).origin) {
    throw new ToolInputError(`path must stay on the profile service, got ${JSON.stringify(path)}.`);
  }
  return url;
}

/** @param {Record<string, string | string[]>} fields */
function toFormBody(fields) {
  const body = new URLSearchParams();
  for (const [name, value] of Object.entries(fields)) {
    for (const v of [value].flat()) body.append(name, String(v));
  }
  return body;
}

// --- Agent tools ------------------------------------------------------------
// Two generic tools. The profile service's HTML tells the model what it can
// do (links and forms), and the service's home page holds the rules it must
// follow, so nothing here knows about profiles or destinations.

class ToolInputError extends Error {}

const TOOLS = [
  {
    type: 'function',
    function: {
      name: 'getPage',
      description:
        'Fetch a page from the profile service. Returns the HTTP status and the page\'s <main> HTML. Use it to read the profile, follow links, and look up destinations (for a method="get" form, put its inputs in the query string).',
      parameters: {
        type: 'object',
        properties: {
          path: {
            type: 'string',
            description: 'A path on the profile service starting with "/", e.g. "/profile" or "/destinations?name=Lisbon".',
          },
        },
        required: ['path'],
        additionalProperties: false,
      },
    },
  },
  {
    type: 'function',
    function: {
      name: 'submitForm',
      description:
        'Submit a method="post" form from a page you have read. Returns the HTTP status and the <main> HTML of the response; its #result section says what happened.',
      parameters: {
        type: 'object',
        properties: {
          action: { type: 'string', description: 'The form\'s action path, e.g. "/profile".' },
          fields: {
            type: 'object',
            description: 'Input names mapped to values. Use an array for an input with several values.',
            additionalProperties: { anyOf: [{ type: 'string' }, { type: 'array', items: { type: 'string' } }] },
          },
        },
        required: ['action', 'fields'],
        additionalProperties: false,
      },
    },
  },
];

/**
 * What a tool call asks for, as far as it can be read from its arguments.
 * Used both to run the call and to show it in the chat.
 * @param {{ name: string, arguments: string }} call
 */
function describeToolCall(call) {
  let args;
  try {
    args = JSON.parse(call.arguments || '{}');
  } catch {
    return { error: 'arguments were not valid JSON' };
  }
  if (call.name === 'getPage') return { method: 'GET', path: args.path };
  if (call.name === 'submitForm') {
    const fields = args.fields;
    if (typeof fields !== 'object' || fields === null || Array.isArray(fields)) {
      return { method: 'POST', path: args.action, error: 'fields must be an object' };
    }
    return { method: 'POST', path: args.action, fields };
  }
  return { error: `unknown tool ${call.name}` };
}

/**
 * Runs one tool call against the backend. Never throws for bad input or a
 * failed request: the model gets an error message it can act on. Throws
 * only if the turn was aborted.
 */
async function runToolCall(call, signal) {
  const request = describeToolCall(call);
  const started = performance.now();
  const log = (extra) =>
    logEvent({ event: 'tool.call', tool: call.name, method: request.method, path: request.path, latencyMs: Math.round(performance.now() - started), ...extra });

  if (request.error) {
    log({ error: request.error });
    return { content: `Error: ${request.error}.`, result: { error: request.error }, profile: null };
  }
  try {
    const response = await agentRequest({ ...request, signal });
    log({ status: response.status, outcome: response.outcome });
    return {
      content: `HTTP ${response.status}\n\n${response.main}`,
      result: { status: response.status, outcome: response.outcome },
      profile: response.profile,
    };
  } catch (error) {
    if (signal.aborted) throw error;
    const message = error instanceof ToolInputError || error instanceof BackendUnreachableError ? error.message : String(error);
    log({ error: message });
    return { content: `Error: ${message}`, result: { error: message }, profile: null };
  }
}

/** The system prompt is the service's home page, which carries the rules. */
function systemPrompt(homeHtml) {
  return `You are the assistant in Profile Builder. You work with the traveler's profile through the profile service, using the getPage and submitForm tools. The service's home page is below. It describes what the service offers and the instructions you must follow.

<page path="/">
${homeHtml}
</page>`;
}

// --- OpenRouter client ------------------------------------------------------

/**
 * A failed turn, classified so the UI can say what to do about it.
 * @typedef {'invalid-key' | 'no-credits' | 'rate-limited' | 'rejected' | 'unavailable' | 'interrupted'
 *   | 'service-unreachable'} LlmErrorKind
 */
class LlmError extends Error {
  /** @param {LlmErrorKind} kind @param {string} message @param {{ status?: number, detail?: string }} [info] */
  constructor(kind, message, { status, detail } = {}) {
    super(message);
    this.kind = kind;
    this.status = status;
    this.detail = detail;
  }
}

/**
 * Streams a chat completion from OpenRouter as server-sent events.
 * Yields { type: 'text', text } as tokens arrive, then one
 * { type: 'done', id, usage, finishReason, toolCalls }. Tool calls arrive in
 * fragments and are assembled here. Throws LlmError on failure, or the fetch
 * AbortError if `signal` is aborted.
 */
async function* streamChatCompletion({ apiKey, model, messages, tools, signal }) {
  let response;
  try {
    response = await fetch(OPENROUTER_URL, {
      method: 'POST',
      headers: {
        Authorization: `Bearer ${apiKey}`,
        'Content-Type': 'application/json',
        'X-Title': 'Profile Builder',
      },
      body: JSON.stringify({ model, messages, tools, stream: true, usage: { include: true } }),
      signal,
    });
  } catch (error) {
    if (signal.aborted) throw error;
    throw new LlmError('unavailable', "Couldn't reach OpenRouter. Check your connection and try again.");
  }
  if (!response.ok) throw await errorFromResponse(response);

  const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
  let buffer = '';
  let id = null;
  let usage = null;
  let finishReason = null;
  let sawDone = false;
  /** @type {Array<{ id: string, name: string, arguments: string }>} */
  const toolCalls = [];
  try {
    while (!sawDone) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += value;
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        // Lines starting with ":" are keep-alive comments; blank lines separate events.
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') {
          sawDone = true;
          break;
        }
        let chunk;
        try {
          chunk = JSON.parse(data);
        } catch {
          continue;
        }
        if (chunk.error) {
          throw new LlmError('interrupted', 'The model stopped with an error partway through its reply.', {
            detail: chunk.error.message,
          });
        }
        id ??= chunk.id ?? null;
        usage = chunk.usage ?? usage;
        const choice = chunk.choices?.[0];
        finishReason = choice?.finish_reason ?? finishReason;
        if (choice?.delta?.content) yield { type: 'text', text: choice.delta.content };
        for (const fragment of choice?.delta?.tool_calls ?? []) {
          const call = (toolCalls[fragment.index ?? toolCalls.length] ??= { id: '', name: '', arguments: '' });
          if (fragment.id) call.id = fragment.id;
          if (fragment.function?.name) call.name += fragment.function.name;
          if (fragment.function?.arguments) call.arguments += fragment.function.arguments;
        }
      }
    }
  } catch (error) {
    if (signal.aborted || error instanceof LlmError) throw error;
    throw new LlmError('interrupted', 'The connection dropped partway through the reply.');
  } finally {
    reader.cancel().catch(() => {});
  }
  if (!sawDone && !finishReason) throw new LlmError('interrupted', 'The reply ended unexpectedly.');
  yield { type: 'done', id, usage, finishReason, toolCalls: toolCalls.filter(Boolean) };
}

/** @param {Response} response @returns {Promise<LlmError>} */
async function errorFromResponse(response) {
  const status = response.status;
  let detail = '';
  try {
    detail = (await response.json())?.error?.message ?? '';
  } catch {}
  const info = { status, detail };
  if (status === 401) return new LlmError('invalid-key', 'OpenRouter rejected your API key.', info);
  if (status === 402) return new LlmError('no-credits', 'Your OpenRouter account is out of credits.', info);
  if (status === 429) {
    return new LlmError('rate-limited', 'Rate limited by OpenRouter or the model provider. Wait a moment, then retry.', info);
  }
  // 400 (e.g. an unknown model ID) and 403 (e.g. input flagged by moderation).
  if (status >= 400 && status < 500) return new LlmError('rejected', 'OpenRouter rejected the request.', info);
  return new LlmError('unavailable', 'OpenRouter or the model provider is unavailable right now.', info);
}

// --- State ------------------------------------------------------------------

/**
 * Loads the profile on mount and whenever the window regains focus. A failed
 * refresh keeps the last good model and reports the error alongside it.
 * `show` displays a profile parsed elsewhere (from an agent tool response).
 */
function useProfile() {
  const [model, setModel] = useState(/** @type {ProfileModel | null} */ (null));
  const [error, setError] = useState(/** @type {Error | null} */ (null));
  const [loading, setLoading] = useState(true);
  const [loadedAt, setLoadedAt] = useState(/** @type {Date | null} */ (null));

  const show = useCallback((next) => {
    setModel(next);
    setError(null);
    setLoadedAt(new Date());
  }, []);

  const refresh = useCallback(async () => {
    setLoading(true);
    try {
      show(await fetchProfile());
    } catch (e) {
      setError(e);
    } finally {
      setLoading(false);
    }
  }, [show]);

  useEffect(() => {
    refresh();
    window.addEventListener('focus', refresh);
    return () => window.removeEventListener('focus', refresh);
  }, [refresh]);

  return { model, error, loading, loadedAt, refresh, show };
}

/**
 * The OpenRouter key and model, kept in localStorage. The key never leaves
 * this browser except in requests to OpenRouter.
 */
function useSettings() {
  const [settings, setSettings] = useState(() => ({
    apiKey: localStorage.getItem(STORAGE_KEYS.apiKey) ?? '',
    model: localStorage.getItem(STORAGE_KEYS.model) || DEFAULT_MODEL,
  }));

  const save = useCallback(({ apiKey, model }) => {
    const next = { apiKey: apiKey.trim(), model: model.trim() || DEFAULT_MODEL };
    if (next.apiKey) localStorage.setItem(STORAGE_KEYS.apiKey, next.apiKey);
    else localStorage.removeItem(STORAGE_KEYS.apiKey);
    if (next.model === DEFAULT_MODEL) localStorage.removeItem(STORAGE_KEYS.model);
    else localStorage.setItem(STORAGE_KEYS.model, next.model);
    setSettings(next);
  }, []);

  return [settings, save];
}

/**
 * @typedef {{ type: 'text', text: string }
 *   | { type: 'tool', id: string, name: string, method?: string, path?: string,
 *       fields?: Record<string, string | string[]>, running: boolean,
 *       status?: number, outcome?: string | null, error?: string }
 *   | { type: 'note', text: string }} Part
 * @typedef {{ id: string, role: 'user', content: string }} UserMessage
 * @typedef {{ id: string, role: 'assistant', parts: Part[], api: object[],
 *             status: 'streaming' | 'done' | 'stopped' | 'error', error?: LlmError }} AssistantMessage
 * @typedef {UserMessage | AssistantMessage} ChatMessage
 */

/**
 * The conversation and the agent loop: stream a completion, run any tool
 * calls it asks for, feed the results back, and repeat until the model
 * replies without tools. `onProfile` receives every profile a tool returns,
 * so the panel updates mid-turn.
 */
function useChat({ apiKey, model }, { onProfile }) {
  const [messages, setMessages] = useState(/** @type {ChatMessage[]} */ ([]));
  const [busy, setBusy] = useState(false);
  const controllerRef = useRef(/** @type {AbortController | null} */ (null));

  const updateMessage = (id, change) => setMessages((ms) => ms.map((m) => (m.id === id ? { ...m, ...change(m) } : m)));
  const appendText = (id, text) =>
    updateMessage(id, ({ parts }) => {
      const last = parts.at(-1);
      return last?.type === 'text'
        ? { parts: [...parts.slice(0, -1), { ...last, text: last.text + text }] }
        : { parts: [...parts, { type: 'text', text }] };
    });
  const addPart = (id, part) => updateMessage(id, ({ parts }) => ({ parts: [...parts, part] }));
  const updatePart = (id, partId, change) =>
    updateMessage(id, ({ parts }) => ({ parts: parts.map((p) => (p.type === 'tool' && p.id === partId ? { ...p, ...change } : p)) }));

  /** Runs one assistant turn in reply to `history`, which ends with a user message. */
  const respond = async (history) => {
    const reply = { id: crypto.randomUUID(), role: 'assistant', parts: [], api: [], status: 'streaming' };
    setMessages([...history, reply]);
    setBusy(true);
    const controller = new AbortController();
    controllerRef.current = controller;
    const { signal } = controller;

    try {
      let home;
      try {
        home = await agentRequest({ method: 'GET', path: '/', signal });
      } catch (error) {
        if (error instanceof BackendUnreachableError) throw new LlmError('service-unreachable', error.message);
        throw error;
      }
      const conversation = [{ role: 'system', content: systemPrompt(home.main) }, ...toApiMessages(history)];
      const turn = [];

      for (let round = 1; ; round++) {
        if (round > MAX_TOOL_ROUNDS) {
          addPart(reply.id, { type: 'note', text: `Stopped after ${MAX_TOOL_ROUNDS} rounds of tool calls.` });
          break;
        }
        const started = performance.now();
        let text = '';
        let toolCalls = [];
        for await (const event of streamChatCompletion({ apiKey, model, messages: [...conversation, ...turn], tools: TOOLS, signal })) {
          if (event.type === 'text') {
            text += event.text;
            appendText(reply.id, event.text);
          }
          if (event.type === 'done') {
            toolCalls = event.toolCalls;
            logEvent({
              event: 'llm.call',
              model,
              round,
              outcome: 'ok',
              latencyMs: Math.round(performance.now() - started),
              requestId: event.id,
              finishReason: event.finishReason,
              toolCalls: toolCalls.map((c) => c.name),
              usage: event.usage,
            });
          }
        }

        turn.push({
          role: 'assistant',
          content: text,
          ...(toolCalls.length > 0 && {
            tool_calls: toolCalls.map((c) => ({ id: c.id, type: 'function', function: { name: c.name, arguments: c.arguments || '{}' } })),
          }),
        });
        if (toolCalls.length === 0) break;

        for (const call of toolCalls) {
          const partId = call.id || crypto.randomUUID();
          const { error, ...request } = describeToolCall(call);
          addPart(reply.id, { type: 'tool', id: partId, name: call.name, ...request, running: true });
          const { content, result, profile } = await runToolCall(call, signal);
          updatePart(reply.id, partId, { running: false, ...result });
          if (profile) onProfile(profile);
          turn.push({ role: 'tool', tool_call_id: call.id, content });
        }
      }
      updateMessage(reply.id, () => ({ status: 'done', api: turn }));
    } catch (error) {
      if (signal.aborted) {
        updateMessage(reply.id, () => ({ status: 'stopped' }));
        logEvent({ event: 'llm.turn', model, outcome: 'stopped' });
      } else {
        const llmError = error instanceof LlmError ? error : new LlmError('unavailable', 'Something went wrong.');
        updateMessage(reply.id, () => ({ status: 'error', error: llmError }));
        logEvent({ event: 'llm.turn', model, outcome: 'error', kind: llmError.kind, status: llmError.status, detail: llmError.detail ?? String(error) });
      }
    } finally {
      controllerRef.current = null;
      setBusy(false);
    }
  };

  const send = (text) => {
    if (busy) return;
    respond([...messages, { id: crypto.randomUUID(), role: 'user', content: text }]);
  };

  /** Re-runs the last turn if it failed. Profile writes are idempotent, so repeating them is safe. */
  const retry = () => {
    const last = messages.at(-1);
    if (busy || last?.role !== 'assistant' || last.status !== 'error') return;
    respond(messages.slice(0, -1));
  };

  const stop = () => controllerRef.current?.abort();

  return { messages, busy, send, retry, stop };
}

/**
 * What the model sees of earlier turns. Completed turns are replayed in full,
 * tool calls included, so the model keeps what it learned. A stopped turn
 * contributes only the text the user saw; a failed one is left out, so a
 * retry starts clean.
 * @param {ChatMessage[]} messages
 */
function toApiMessages(messages) {
  return messages.flatMap((m) => {
    if (m.role === 'user') return [{ role: 'user', content: m.content }];
    if (m.status === 'done') return m.api;
    const text = m.parts.filter((p) => p.type === 'text').map((p) => p.text).join('\n\n');
    return m.status === 'stopped' && text ? [{ role: 'assistant', content: text }] : [];
  });
}

// --- Chat components --------------------------------------------------------

function Chat({ messages, busy, send, retry, stop, onOpenSettings }) {
  const endRef = useRef(null);
  useEffect(() => {
    endRef.current?.scrollIntoView({ block: 'end' });
  }, [messages]);

  return html`
    <section className="card chat" aria-label="Chat">
      <div className="messages" aria-live="polite">
        ${messages.length === 0 &&
        html`<div className="chat-empty">
          <h2>Tell me how you like to travel</h2>
          <p>Where you've loved going, who you travel with, what you like to eat. Your profile fills in on the right.</p>
        </div>`}
        ${messages.map(
          (m, i) => html`<${Message}
            key=${m.id}
            message=${m}
            isLast=${i === messages.length - 1}
            onRetry=${retry}
            onOpenSettings=${onOpenSettings}
          />`,
        )}
        <div ref=${endRef} />
      </div>
      <${Composer} busy=${busy} onSend=${send} onStop=${stop} />
    </section>
  `;
}

function Message({ message, isLast, onRetry, onOpenSettings }) {
  if (message.role === 'user') {
    return html`<div className="message user"><div className="bubble">${message.content}</div></div>`;
  }
  const { parts, status, error } = message;
  const streaming = status === 'streaming';
  const last = parts.at(-1);
  // Show the typing dots whenever the model is working but nothing is visibly happening.
  const waiting = streaming && (!last || (last.type === 'tool' && !last.running));
  return html`
    <div className="message assistant">
      ${parts.map((part, i) => {
        if (part.type === 'tool') return html`<${ToolCall} key=${part.id} call=${part} />`;
        if (part.type === 'note') return html`<div key=${i} className="message-note">${part.text}</div>`;
        const caret = streaming && part === last;
        return html`<div key=${i} className=${`bubble${caret ? ' caret' : ''}`}>${part.text}</div>`;
      })}
      ${waiting && html`<div className="bubble"><span className="typing" aria-label="Assistant is working"><span /><span /><span /></span></div>`}
      ${status === 'stopped' && html`<div className="message-note">Stopped</div>`}
      ${status === 'error' &&
      html`<${MessageError}
        error=${error}
        partial=${parts.some((p) => p.type === 'text')}
        canRetry=${isLast}
        onRetry=${onRetry}
        onOpenSettings=${onOpenSettings}
      />`}
    </div>
  `;
}

/** One tool call, shown as the request it made and what came back. */
function ToolCall({ call }) {
  const tone = call.running ? 'running' : call.error ? 'error' : toneOf(call.status, call.outcome);
  const result = call.running ? 'running…' : call.error ? 'error' : [call.status, call.outcome].filter(Boolean).join(' ');
  return html`
    <div className=${`tool-call ${tone}`} title=${call.error ?? ''}>
      <span className="tool-name">${call.name}</span>
      ${call.path && html`<span className="tool-target">${call.method} ${call.path}</span>`}
      ${call.fields && html`<span className="tool-fields">${formatFields(call.fields)}</span>`}
      <span className="tool-result">${result}</span>
    </div>
  `;
}

/** @param {number | undefined} status @param {string | null | undefined} outcome */
function toneOf(status, outcome) {
  if (outcome === 'conflict' || outcome === 'reported' || outcome === 'not-found') return 'warn';
  if (!status || status >= 400) return 'error';
  return outcome === 'unchanged' ? 'neutral' : 'ok';
}

/** @param {Record<string, string | string[]>} fields */
function formatFields(fields) {
  const clip = (v) => (v.length > 48 ? `${v.slice(0, 47)}…` : v);
  return Object.entries(fields)
    .map(([name, value]) => `${name}=${[value].flat().map((v) => JSON.stringify(clip(String(v)))).join(',')}`)
    .join(' ');
}

function MessageError({ error, partial, canRetry, onRetry, onOpenSettings }) {
  const needsSettings = error.kind === 'invalid-key' || error.kind === 'rejected' || error.kind === 'no-credits';
  return html`
    <div className="message-error" role="alert">
      <strong>${error.message}</strong>
      ${error.kind === 'service-unreachable' && html`<div className="detail">Start it with npm start in the project folder, then retry.</div>`}
      ${error.detail && html`<div className="detail">${error.detail}</div>`}
      ${partial && html`<div className="detail">The text above is incomplete.</div>`}
      <div className="actions">
        ${canRetry && html`<button className="button" onClick=${onRetry}>Retry</button>`}
        ${needsSettings && html`<button className="button" onClick=${onOpenSettings}>Open settings</button>`}
      </div>
    </div>
  `;
}

function Composer({ busy, onSend, onStop }) {
  const [text, setText] = useState('');
  const textareaRef = useRef(null);

  // Grow with the content, up to the max-height set in CSS.
  useEffect(() => {
    const el = textareaRef.current;
    el.style.height = 'auto';
    el.style.height = `${el.scrollHeight + 2}px`;
  }, [text]);

  const submit = () => {
    const message = text.trim();
    if (!message || busy) return;
    onSend(message);
    setText('');
  };

  return html`
    <form
      className="composer"
      onSubmit=${(e) => {
        e.preventDefault();
        submit();
      }}
    >
      <textarea
        ref=${textareaRef}
        rows="1"
        value=${text}
        placeholder=${busy ? 'Waiting for the reply…' : 'Message the assistant'}
        aria-label="Message"
        onInput=${(e) => setText(e.target.value)}
        onKeyDown=${(e) => {
          if (e.key === 'Enter' && !e.shiftKey && !e.nativeEvent.isComposing) {
            e.preventDefault();
            submit();
          }
        }}
      />
      ${busy
        ? html`<button type="button" className="button" onClick=${onStop}>Stop</button>`
        : html`<button type="submit" className="button primary" disabled=${!text.trim()}>Send</button>`}
    </form>
  `;
}

// --- Settings components ----------------------------------------------------

function SetupCard({ settings, onSave }) {
  return html`
    <section className="card chat" aria-label="Set up">
      <div className="setup">
        <h2>Connect a model</h2>
        <p>Profile Builder talks to the model through OpenRouter, using your own API key.</p>
        <${SettingsForm} settings=${settings} onSave=${onSave} submitLabel="Start chatting" />
      </div>
    </section>
  `;
}

function SettingsDialog({ settings, onSave, onClose }) {
  useEffect(() => {
    const onKey = (e) => e.key === 'Escape' && onClose();
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);

  return html`
    <div className="overlay" onMouseDown=${(e) => e.target === e.currentTarget && onClose()}>
      <div className="card dialog" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <h2 id="settings-title">Settings</h2>
        <${SettingsForm} settings=${settings} onSave=${onSave} onCancel=${onClose} submitLabel="Save" allowRemove />
      </div>
    </div>
  `;
}

function SettingsForm({ settings, onSave, onCancel, submitLabel, allowRemove = false }) {
  const [apiKey, setApiKey] = useState(settings.apiKey);
  const [model, setModel] = useState(settings.model);

  return html`
    <form
      className="settings-form"
      onSubmit=${(e) => {
        e.preventDefault();
        onSave({ apiKey, model });
      }}
    >
      <label>
        OpenRouter API key
        <input
          className="input"
          type="password"
          autoComplete="off"
          spellCheck="false"
          placeholder="sk-or-…"
          value=${apiKey}
          onInput=${(e) => setApiKey(e.target.value)}
          autoFocus
        />
        <span className="hint">
          Get one at <a href="https://openrouter.ai/keys" target="_blank" rel="noreferrer">openrouter.ai/keys</a>.
          It's stored only in this browser and sent only to OpenRouter.
        </span>
      </label>
      <label>
        Model
        <input
          className="input"
          spellCheck="false"
          placeholder=${DEFAULT_MODEL}
          value=${model}
          onInput=${(e) => setModel(e.target.value)}
        />
        <span className="hint">Any OpenRouter model ID. Default: ${DEFAULT_MODEL}.</span>
      </label>
      <div className="actions">
        ${allowRemove &&
        settings.apiKey &&
        html`<button type="button" className="button quiet" onClick=${() => onSave({ apiKey: '', model })}>
          Remove key
        </button>`}
        <span className="spacer" />
        ${onCancel && html`<button type="button" className="button" onClick=${onCancel}>Cancel</button>`}
        <button type="submit" className="button primary" disabled=${!apiKey.trim()}>${submitLabel}</button>
      </div>
    </form>
  `;
}

// --- Profile panel components -----------------------------------------------

function ProfilePanel({ model, error, loading, loadedAt, refresh }) {
  return html`
    <aside className="card panel" aria-label="Travel profile">
      <div className="panel-header">
        <div>
          <h2 className="panel-title">Travel profile</h2>
          <p className="panel-subtitle">${loadedAt ? `Updated ${formatTime(loadedAt)}` : error ? 'Not loaded' : 'Loading…'}</p>
        </div>
        <button
          className=${`icon-button${loading ? ' spinning' : ''}`}
          onClick=${refresh}
          disabled=${loading}
          aria-label="Refresh profile"
          title="Refresh"
        >
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M21 12a9 9 0 1 1-3-6.7L21 8" />
            <path d="M21 3v5h-5" />
          </svg>
        </button>
      </div>

      ${error && html`<${ErrorNotice} error=${error} hasModel=${Boolean(model)} onRetry=${refresh} />`}
      ${!model && !error && html`<${Skeleton} />`}
      ${model && html`<${ProfileContents} model=${model} />`}
    </aside>
  `;
}

function ProfileContents({ model }) {
  const filled = model.fields.filter((f) => f.values.length > 0).length;
  const conflictedFields = new Set(model.conflicts.map((c) => c.field));
  const labelOf = (name) => model.fields.find((f) => f.name === name)?.label ?? name;

  return html`
    <div className="progress">
      <div className="progress-track">
        <div className="progress-fill" style=${{ width: `${(filled / model.fields.length) * 100}%` }} />
      </div>
      <div className="progress-label">${filled} of ${model.fields.length} preferences shared</div>
    </div>

    ${model.conflicts.length > 0 && html`<${ConflictList} conflicts=${model.conflicts} labelOf=${labelOf} />`}

    <ul className="fields">
      ${model.fields.map(
        (field) => html`<${FieldRow} key=${field.name} field=${field} conflicted=${conflictedFields.has(field.name)} />`,
      )}
    </ul>
  `;
}

function FieldRow({ field, conflicted }) {
  return html`
    <li className="field">
      <div className="field-label">
        ${field.label}
        ${conflicted && html`<span className="field-flag">Needs clarification</span>`}
      </div>
      ${field.values.length === 0
        ? html`<div className="field-empty">Not shared yet</div>`
        : html`<ul className="chips">${field.values.map((v) => html`<li key=${v} className="chip">${v}</li>`)}</ul>`}
    </li>
  `;
}

function ConflictList({ conflicts, labelOf }) {
  return html`
    <section className="conflicts" aria-label="Open conflicts">
      <h3 className="conflicts-title">
        ${conflicts.length === 1 ? 'One thing needs clarifying' : `${conflicts.length} things need clarifying`}
      </h3>
      <p className="conflicts-hint">Nothing has been overwritten. Clarify in the chat to resolve.</p>
      ${conflicts.map(
        (c) => html`
          <div key=${c.id} className="conflict">
            <div className="conflict-field">${labelOf(c.field)}</div>
            <dl className="conflict-compare">
              <dt>Profile says</dt>
              <dd>${c.existing.length ? c.existing.join(', ') : 'nothing yet'}</dd>
              <dt>New</dt>
              <dd>${c.newInformation}</dd>
            </dl>
          </div>
        `,
      )}
    </section>
  `;
}

function ErrorNotice({ error, hasModel, onRetry }) {
  const title =
    error instanceof BackendUnreachableError
      ? error.message
      : error instanceof ContractError
        ? 'The profile service sent something unexpected.'
        : 'Something went wrong loading the profile.';
  return html`
    <div className="notice" role="alert">
      <strong>${title}</strong>
      ${error instanceof BackendUnreachableError
        ? html`Start it with <code>npm start</code> in the project folder.`
        : error.message}
      ${hasModel && html`<div>Showing the last profile that loaded.</div>`}
      <div><button onClick=${onRetry}>Try again</button></div>
    </div>
  `;
}

function Skeleton() {
  return html`
    <div className="skeleton" aria-hidden="true">
      ${[0, 1, 2, 3, 4, 5].map((i) => html`<div key=${i} className="skeleton-row" />`)}
    </div>
  `;
}

/** @param {Date} date */
function formatTime(date) {
  return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
